<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltaic | Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f3f7fa; font-family: 'Inter', sans-serif; }
        .glass-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .status-badge { transition: all 0.3s ease; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">⚙️ Settings</h1>
                <p class="text-gray-500">Device management & security</p>
            </div>
            <a href="hub.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300 transition-all flex items-center gap-2">
                <i data-lucide="home" class="w-4 h-4"></i> Hub
            </a>
        </header>

        <div class="space-y-6">
            
            <div class="glass-card p-6">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="cpu" class="text-indigo-500 w-5 h-5"></i>
                    <h2 class="text-lg font-bold text-gray-800">Device Information</h2>
                </div>
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Linked ESP ID</p>
                        <p id="displayEspId" class="text-xl font-mono font-bold text-indigo-600 mt-1">Loading...</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Active Status</p>
                        <div id="statusIndicator" class="mt-1 flex items-center gap-2 justify-end">
                            <span id="statusLabel" class="text-sm font-bold uppercase tracking-wider">--</span>
                            <span id="statusDot" class="w-3 h-3 rounded-full bg-gray-300"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-6">
                <div class="flex items-center gap-2 mb-2">
                    <i data-lucide="shield-alert" class="w-5 h-5 text-red-500"></i>
                    <h2 class="text-lg font-bold text-gray-800">Security Actions</h2>
                </div>
                <p class="text-sm text-gray-500 mb-6">Change the operational state of your meter. Blocking stops data processing.</p>
                
                <button id="blockBtn" class="w-full py-3 rounded-xl font-bold text-sm transition shadow-md flex items-center justify-center gap-2 disabled:opacity-50">
                    <i data-lucide="power" class="w-4 h-4"></i>
                    <span>Connecting...</span>
                </button>
                <p class="text-[11px] text-gray-400 mt-3 italic text-center">* Once blocked, the ESP will stop sending energy updates until unblocked.</p>
            </div>

            <div class="glass-card p-6 border-l-4 border-red-500">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="log-out" class="w-5 h-5 text-gray-600"></i>
                    <h2 class="text-lg font-bold text-gray-800">Session</h2>
                </div>
                <button id="logoutBtn" class="w-full flex items-center justify-center gap-2 bg-red-50 text-red-600 border border-red-100 py-3 rounded-xl font-bold hover:bg-red-600 hover:text-white transition-all">
                    Sign Out of System
                </button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
        // 🔧 Replace with your Firebase config from:
        // Firebase Console → Project Settings → Your Apps → SDK setup
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentEspId = "";
    let currentStatus = "";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // Get ESP ID from user profile
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentEspId = userDoc.data().esp_id;
                    document.getElementById("displayEspId").innerText = currentEspId;
                    listenToSystemStatus(currentEspId);
                } else {
                    document.getElementById("displayEspId").innerText = "No ID Found";
                }
            } catch (err) {
                console.error(err);
                document.getElementById("displayEspId").innerText = "Error";
            }
        } else {
            window.location.href = "login.html";
        }
    });

    function listenToSystemStatus(espId) {
        const docRef = doc(db, "esp_devices", espId);
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                currentStatus = docSnap.data().status || "active";
                updateUI(currentStatus);
            }
        });
    }

    function updateUI(status) {
        const label = document.getElementById("statusLabel");
        const dot = document.getElementById("statusDot");
        const btn = document.getElementById("blockBtn");
        
        label.innerText = status;
        
        if (status === "active") {
            label.className = "text-sm font-bold uppercase tracking-wider text-emerald-600";
            dot.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
            btn.innerHTML = '<i data-lucide="shield-off" class="w-4 h-4"></i> Block System';
            btn.className = "w-full py-3 bg-red-500 text-white rounded-xl font-bold text-sm hover:bg-red-600 transition shadow-md flex items-center justify-center gap-2";
        } else {
            label.className = "text-sm font-bold uppercase tracking-wider text-red-600";
            dot.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]";
            btn.innerHTML = '<i data-lucide="shield-check" class="w-4 h-4"></i> Activate System';
            btn.className = "w-full py-3 bg-emerald-500 text-white rounded-xl font-bold text-sm hover:bg-emerald-600 transition shadow-md flex items-center justify-center gap-2";
        }
        lucide.createIcons(); // Refresh icons inside buttons
    }

    // Block/Unblock Button Logic
    document.getElementById("blockBtn").onclick = async () => {
        if (!currentEspId) return;
        
        const action = (currentStatus === "active") ? "BLOCK" : "ACTIVATE";
        const message = (currentStatus === "active") 
            ? "Are you sure? This will stop all power data monitoring." 
            : "Re-activate system and start data monitoring?";

        if (confirm(`${action} SYSTEM?\n\n${message}`)) {
            const newStatus = (currentStatus === "active") ? "blocked" : "active";
            const docRef = doc(db, "esp_devices", currentEspId);
            try {
                await updateDoc(docRef, { status: newStatus });
            } catch (error) {
                alert("Error: " + error.message);
            }
        }
    };

    // Logout Logic
    document.getElementById("logoutBtn").onclick = () => {
        if(confirm("Are you sure you want to sign out?")) {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        }
    };

    lucide.createIcons();
</script>
</body>
</html>
